<div class="shell">
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/" title="Open the landing page"><app-wordmark [small]="true" /></a>
      <div class="account">
        @if (username(); as name) { <span class="who">{{ name }}</span> }
        @if (isAdmin()) { <a class="btn tiny" routerLink="/admin">Admin</a> }
        <button type="button" class="btn btn-ghost" (click)="signOut()" [disabled]="signingOut()">
          {{ signingOut() ? 'Signing out…' : 'Sign out' }}
        </button>
      </div>
    </div>
    <nav class="tabs" aria-label="Dashboard sections">
      <div class="tabs-inner">
        @for (tab of tabs; track tab.path) {
          <a [routerLink]="['/dashboard', tab.path]" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" class="tab">{{ tab.label }}</a>
        }
      </div>
    </nav>
  </header>
  <main class="content"><router-outlet /></main>
</div>
