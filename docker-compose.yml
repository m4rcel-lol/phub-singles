name: pornhub-singles

services:
  # The Go binary: REST API, uploaded media and the embedded Angular bundle.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pornhub-singles/app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PHS_ADDR: ":8080"
      PHS_DB_PATH: /data/phs.db
      PHS_UPLOAD_DIR: /data/uploads
      PHS_PUBLIC_URL: http://localhost:25169
      # The app is exposed directly, so never trust client-supplied proxy headers.
      PHS_TRUST_PROXY: "false"
    volumes:
      - app-data:/data
    ports:
      - "25169:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data: # SQLite database + uploaded avatars
